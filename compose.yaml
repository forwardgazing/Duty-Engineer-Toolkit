# Учебный стенд. Пароли БД — дефолтные для лабы, данные MySQL не содержат
# ничего чувствительного. PSK-ключ хранится локально (secrets/), в репозиторий не попадает.
services:
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-8.0-latest
    ports:
      - "10051:10051"
    volumes:
      - /usr/lib/zabbix/alertscripts:/usr/lib/zabbix/alertscripts
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
      ZBX_ALLOWUNSUPPORTEDDBVERSIONS: 1
    depends_on:
      - mysql-server

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-8.0-latest
    ports:
      - "80:8080"
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_pwd
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Moscow
    depends_on:
      - zabbix-server

  mysql-server:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
    volumes:
      - ./mysql_data:/var/lib/mysql

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-8.0-latest
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_TLSCONNECT: psk
      ZBX_SERVER_HOST: zabbix-server
      ZBX_TLSACCEPT: psk
      ZBX_TLSPSKIDENTITY: "Zabbix server PSK"
      ZBX_TLSPSKFILE: /run/secrets/zabbix_agent_server.psk
    volumes:
      - ./secrets/zabbix_agent_server.psk:/run/secrets/zabbix_agent_server.psk:ro
    depends_on:
      - zabbix-server
